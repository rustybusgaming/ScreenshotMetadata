name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        mc-profile:
          - stable
          - beta
          - mc1_21_10
          - mc1_21_9
          - mc1_21_8
          - mc1_21_7
          - mc1_21_6
          - mc1_21_5
          - mc1_21_4
          - mc1_21_3
          - mc1_21_2
          - mc1_21_1
          - mc26_3
          - mc26_2
          - mc26_1_2
          - mc26_1_1
          - mc26_1
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
      
    # Loom itself needs Java 25 to run; the 1.21.x profiles still compile against
    # a Java 21 toolchain, which Gradle picks up from the second JDK installed here.
    - name: Set up JDKs
      uses: actions/setup-java@v5
      with:
        java-version: |
          21
          25
        distribution: 'temurin'
        cache: gradle
          
    - name: Grant execute permission for gradlew
      run: chmod +x screenshotmetadata/gradlew
      
    - name: Build with Gradle (${{ matrix.mc-profile }})
      working-directory: screenshotmetadata
      run: ./gradlew build -PmcProfile=${{ matrix.mc-profile }} --no-daemon

    - name: Publish to Modrinth and CurseForge (${{ matrix.mc-profile }})
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      working-directory: screenshotmetadata
      run: ./gradlew publishMods -PmcProfile=${{ matrix.mc-profile }} --no-daemon
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: build-artifacts-${{ matrix.mc-profile }}
        retention-days: 14
        path: |
          screenshotmetadata/build/libs/*.jar

    - name: Upload build reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-reports-${{ matrix.mc-profile }}
        retention-days: 14
        if-no-files-found: ignore
        path: screenshotmetadata/build/reports/
