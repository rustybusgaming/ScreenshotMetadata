name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc-profile: stable
            java-version: 21
          - mc-profile: beta
            java-version: 25
          - mc-profile: mc1_21_10
            java-version: 21
          - mc-profile: mc1_21_9
            java-version: 21
          - mc-profile: mc1_21_8
            java-version: 21
          - mc-profile: mc1_21_7
            java-version: 21
          - mc-profile: mc1_21_6
            java-version: 21
          - mc-profile: mc1_21_5
            java-version: 21
          - mc-profile: mc1_21_4
            java-version: 21
          - mc-profile: mc1_21_3
            java-version: 21
          - mc-profile: mc1_21_2
            java-version: 21
          - mc-profile: mc1_21_1
            java-version: 21
          - mc-profile: mc26
            java-version: 25
          - mc-profile: mc26_1
            java-version: 25
          - mc-profile: mc26_2
            java-version: 25
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: gradle
          
    - name: Grant execute permission for gradlew
      run: chmod +x screenshotmetadata/gradlew
      
    - name: Build with Gradle (${{ matrix.mc-profile }})
      working-directory: screenshotmetadata
      run: ./gradlew build -PmcProfile=${{ matrix.mc-profile }} --no-daemon

    - name: Publish to Modrinth and CurseForge (${{ matrix.mc-profile }})
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      working-directory: screenshotmetadata
      run: ./gradlew publishMods -PmcProfile=${{ matrix.mc-profile }} --no-daemon
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: build-artifacts-java-${{ matrix.java-version }}-${{ matrix.mc-profile }}
        retention-days: 14
        path: |
          screenshotmetadata/build/libs/*.jar

    - name: Upload build reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-reports-java-${{ matrix.java-version }}-${{ matrix.mc-profile }}
        retention-days: 14
        if-no-files-found: ignore
        path: screenshotmetadata/build/reports/
