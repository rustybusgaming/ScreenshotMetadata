name: Publish Mod

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Minecraft target profile'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - neoforge
          - stable
          - beta
          - mc1_21_1
          - mc1_21_2
          - mc1_21_3
          - mc1_21_4
          - mc1_21_5
          - mc1_21_6
          - mc1_21_7
          - mc1_21_8
          - mc1_21_9
          - mc1_21_10
          - mc26_1
          - mc26_1_1
          - mc26_1_2
          - mc26_2
          - mc26_3
      version:
        description: 'Version to publish (optional override for mod_version)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
    - name: Verify publishing tokens are present
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      run: |
        missing=""
        [ -z "$CURSEFORGE_TOKEN" ] && missing="$missing CURSEFORGE_TOKEN"
        [ -z "$MODRINTH_TOKEN" ] && missing="$missing MODRINTH_TOKEN"
        if [ -n "$missing" ]; then
          echo "::error::Missing repository secret(s):$missing - nothing would be published."
          exit 1
        fi
        echo "Both publishing tokens are set."

  publish:
    needs: check-secrets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc-profile:
          - stable
          - beta
          - mc1_21_1
          - mc1_21_2
          - mc1_21_3
          - mc1_21_4
          - mc1_21_5
          - mc1_21_6
          - mc1_21_7
          - mc1_21_8
          - mc1_21_9
          - mc1_21_10
          - mc26_1
          - mc26_1_1
          - mc26_1_2
          - mc26_2
          - mc26_3
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    # Loom itself needs Java 25 to run; the 1.21.x profiles still compile against
    # a Java 21 toolchain, which Gradle picks up from the second JDK installed here.
    - name: Set up JDKs
      uses: actions/setup-java@v6
      with:
        java-version: |
          21
          25
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x screenshotmetadata/gradlew

    - name: Resolve the newest snapshot for the beta profile
      id: beta_versions
      if: matrix.mc-profile == 'beta'
      shell: bash
      run: |
        set -euo pipefail

        # Everything below is derived from one snapshot alias. An earlier version of
        # this step took the game version from the newest Yarn snapshot while taking
        # the Fabric API and the store version from the newest actual snapshot. Yarn
        # stopped publishing after 25w46a, so those drifted apart and the upload named
        # a version the build was not for.
        game_json="$(curl -fsSL https://meta.fabricmc.net/v2/versions/game)"
        fabric_metadata_xml="$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml)"

        latest_snapshot_alias="$(echo "$game_json" | jq -r '[.[] | select(.stable == false and (.version | test("^[0-9]+\\.[0-9]+-snapshot-[0-9]+$")))] | .[0].version')"
        if [ -z "$latest_snapshot_alias" ] || [ "$latest_snapshot_alias" = "null" ]; then
          echo "::error::Unable to resolve the latest snapshot alias from Fabric metadata"
          exit 1
        fi

        release_branch="$(echo "$latest_snapshot_alias" | sed -E 's/^([0-9]+\.[0-9]+)-snapshot-[0-9]+$/\1/')"
        if [ -z "$release_branch" ] || [ "$release_branch" = "$latest_snapshot_alias" ]; then
          echo "::error::Unable to derive the release branch from snapshot alias: $latest_snapshot_alias"
          exit 1
        fi

        latest_fabric_version="$(echo "$fabric_metadata_xml" | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -E "\\+${release_branch}$" | sort -V | tail -n1)"
        if [ -z "$latest_fabric_version" ]; then
          echo "::error::Unable to resolve a Fabric API version for branch $release_branch"
          exit 1
        fi

        echo "Snapshot $latest_snapshot_alias with Fabric API $latest_fabric_version"
        echo "minecraft_version=$latest_snapshot_alias" >> "$GITHUB_OUTPUT"
        echo "modrinth_minecraft_version=$latest_snapshot_alias" >> "$GITHUB_OUTPUT"
        echo "fabric_version=$latest_fabric_version" >> "$GITHUB_OUTPUT"

    - name: Build mod (${{ matrix.mc-profile }})
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.profile == 'all' || github.event.inputs.profile == matrix.mc-profile
      run: |
        EXTRA_VERSION_ARG=""
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          EXTRA_VERSION_ARG="-Pmod_version=${{ github.event.inputs.version }}"
        fi
        EXTRA_BETA_ARGS=""
        if [ "${{ matrix.mc-profile }}" = "beta" ]; then
          EXTRA_BETA_ARGS="-Pbeta_minecraft_version=${{ steps.beta_versions.outputs.minecraft_version }} -Pbeta_modrinth_minecraft_version=${{ steps.beta_versions.outputs.modrinth_minecraft_version }} -Pbeta_fabric_version=${{ steps.beta_versions.outputs.fabric_version }}"
        fi
        cd screenshotmetadata
        ./gradlew clean build -PmcProfile=${{ matrix.mc-profile }} $EXTRA_VERSION_ARG $EXTRA_BETA_ARGS --no-configuration-cache
      
    - name: Publish to CurseForge and Modrinth (${{ matrix.mc-profile }})
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.profile == 'all' || github.event.inputs.profile == matrix.mc-profile
      run: |
        EXTRA_VERSION_ARG=""
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          EXTRA_VERSION_ARG="-Pmod_version=${{ github.event.inputs.version }}"
        fi
        EXTRA_BETA_ARGS=""
        if [ "${{ matrix.mc-profile }}" = "beta" ]; then
          EXTRA_BETA_ARGS="-Pbeta_minecraft_version=${{ steps.beta_versions.outputs.minecraft_version }} -Pbeta_modrinth_minecraft_version=${{ steps.beta_versions.outputs.modrinth_minecraft_version }} -Pbeta_fabric_version=${{ steps.beta_versions.outputs.fabric_version }}"
        fi
        cd screenshotmetadata
        ./gradlew publishMods -PmcProfile=${{ matrix.mc-profile }} $EXTRA_VERSION_ARG $EXTRA_BETA_ARGS --no-configuration-cache
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        
    - name: Upload build artifacts
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.profile == 'all' || github.event.inputs.profile == matrix.mc-profile
      uses: actions/upload-artifact@v7
      with:
        name: mod-jars-${{ matrix.mc-profile }}
        path: screenshotmetadata/build/libs/*.jar

  # NeoForge jars go to the same CurseForge and Modrinth projects. Runs on tags and
  # for the 'all' or 'neoforge' choices of a manual run.
  publish-neoforge:
    needs: check-secrets
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.profile == 'all' || github.event.inputs.profile == 'neoforge'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc-profile:
          - mc1_21_1
          - mc1_21_3
          - mc1_21_4
          - mc1_21_5
          - mc1_21_6
          - mc1_21_7
          - mc1_21_8
          - mc1_21_9
          - mc1_21_10
          - mc1_21_11
          - mc26_1
          - mc26_1_1
          - mc26_1_2
          - mc26_2
          - mc26_3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDKs
      uses: actions/setup-java@v6
      with:
        java-version: |
          21
          25
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x screenshotmetadata/gradlew

    - name: Build and publish (NeoForge ${{ matrix.mc-profile }})
      run: |
        EXTRA_VERSION_ARG=""
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          EXTRA_VERSION_ARG="-Pmod_version=${{ github.event.inputs.version }}"
        fi
        cd screenshotmetadata
        ./gradlew -p neoforge clean build publishMods -PmcProfile=${{ matrix.mc-profile }} $EXTRA_VERSION_ARG --no-configuration-cache
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: mod-jars-neoforge-${{ matrix.mc-profile }}
        path: screenshotmetadata/neoforge/build/libs/*.jar

