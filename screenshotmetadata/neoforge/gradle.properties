org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# The mod version is read from ../gradle.properties so every build ships the same number.

# Profile to build when -PmcProfile is not given.
default_mc_profile=mc1_21_1

# One profile per Minecraft version; the NeoForge version is the newest build for it.
# Check https://projects.neoforged.net/neoforged/neoforge
# 1.21.6, 1.21.7, 1.21.9, 26.1 and 26.1.1 only ever had beta NeoForge builds.
# 1.21.2 is left out: NeoForge never got past a single beta (21.2.1-beta) before 1.21.3.
mc1_21_1_minecraft_version=1.21.1
mc1_21_1_neo_version=21.1.265

mc1_21_3_minecraft_version=1.21.3
mc1_21_3_neo_version=21.3.100

