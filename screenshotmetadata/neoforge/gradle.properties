mc1_21_4_neo_version=21.4.161

mc1_21_5_minecraft_version=1.21.5
mc1_21_5_neo_version=21.5.101

mc1_21_6_minecraft_version=1.21.6
mc1_21_6_neo_version=21.6.20-beta

mc1_21_7_minecraft_version=1.21.7
