org.gradle.jvmargs=-Xmx2G
# Loom's generated IDE run configurations are not configuration-cache safe on BTA.
org.gradle.configuration-cache=false

# The mod version is read from ../gradle.properties so every build ships the same number.

# Check https://downloads.betterthanadventure.net/bta-client/
bta_version=8.0.1
# One of release, prerelease, nightly or misc.
bta_channel=release
# Check https://maven.thesignalumproject.net/#/infrastructure/net/fabricmc/fabric-loader/
loader_version=0.18.4-bta.11
# BTA 8 runs on Java 17.
java_version=17
# LWJGL natives for runClient; match the LWJGL bundled with the BTA release.
lwjgl_version=3.3.3
